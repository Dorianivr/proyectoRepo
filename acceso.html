<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SmartPark · Acceso inteligente</title>
    <style>
      :root {
        --bg: #2a2b30;
        --card: #1c1d21;
        --ink: #fff;
        --mute: #a4a7ae;
        --line: #3a3b41;
        --yel: #f5c400;
        --bad: #ff9a8a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        font-family:
          "Plus Jakarta Sans", "Segoe UI", Roboto, system-ui, sans-serif;
        background: linear-gradient(180deg, #2c2d32 0%, #1a1b1e 100%);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 10px;
        background: #111;
        border-bottom: 4px solid #f5c400;
      }
      .lg {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        background: #f5c400;
        display: grid;
        place-items: center;
        flex: none;
      }
      .brand {
        font-size: clamp(24px, 6vw, 28px);
        letter-spacing: 0.5px;
        line-height: 1;
      }
      .brand b {
        font-weight: 800;
        color: #f5c400;
      }
      .brand span {
        font-weight: 300;
        color: #fff;
      }
      header small {
        margin-left: auto;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #c8ccd2;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 16px;
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 460px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 44px 22px 24px;
        box-shadow: 0 0 44px rgba(249, 204, 21, 0.14);
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 12%;
        right: 12%;
        height: 4px;
        border-radius: 0 0 6px 6px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--yel),
          transparent
        );
      }
      h1 {
        margin: 0 0 8px;
        text-align: center;
        font-size: clamp(28px, 7vw, 36px);
        font-weight: 800;
      }
      .lead {
        margin: 0 0 26px;
        text-align: center;
        color: var(--mute);
        font-size: clamp(14px, 3.8vw, 17px);
      }
      .plate {
        background: #fff;
        border: 6px solid #9b9ea5;
        border-radius: 22px;
        padding: 12px 16px 10px;
        margin-bottom: 12px;
        transition:
          box-shadow 0.15s,
          border-color 0.15s;
      }
      .plate:focus-within {
        box-shadow: 0 0 0 4px rgba(249, 204, 21, 0.55);
      }
      .plate.err {
        border-color: #e5533d;
      }
      .pt {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.03em;
        color: #5b6475;
      }
      .pt i {
        font-style: normal;
        color: #8d99ad;
      }
      .plate input {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        text-align: center;
        text-transform: uppercase;
        outline: 0;
        color: #1c2333;
        font:
          700 clamp(34px, 11vw, 54px)/1.2 ui-monospace,
          "JetBrains Mono",
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.1em;
      }
      .plate input::placeholder {
        color: #ccd5e3;
      }
      .pb {
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #8d99ad;
      }
      .msg {
        min-height: 22px;
        margin: 0 0 14px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        color: var(--bad);
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        height: 66px;
        border: 0;
        border-radius: 22px;
        background: var(--yel);
        color: #26272b;
        font: 800 clamp(22px, 6vw, 28px) inherit;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 8px 28px rgba(249, 204, 21, 0.3);
        transition: transform 0.1s;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      .btn.ghost {
        background: transparent;
        color: #fff;
        border: 1.5px solid var(--line);
        box-shadow: none;
        height: 54px;
        font-size: 18px;
        margin-top: 12px;
      }
      .hidden {
        display: none !important;
      }
      @media (min-width: 700px) {
        main {
          padding: 48px;
        }
        .card {
          padding: 52px 34px 32px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="lg" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 34 34"
          fill="none"
          stroke="#111"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12l3-6h18l3 6" />
          <path d="M6 12h22v16H6z" />
          <path d="M11 28v-7h12v7" />
          <path d="M14 17h6" />
        </svg>
      </div>
      <div class="brand"><b>SMART</b><span>PARK</span></div>
      <small>ACCESO</small>
    </header>
    <main>
      <div class="card">
        <section id="s1">
          <h1>Ingresa Placas</h1>
          <p class="lead">Introduce la matrícula para registrar la entrada</p>
          <div class="plate" id="plate">
            <div class="pt">
              <span>MÉXICO</span><i>SMARTPARK</i><span>2026</span>
            </div>
            <input
              id="pin"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              maxlength="8"
              placeholder="ABC-123"
              aria-label="Placa del vehículo"
            />
            <div class="pb">REGISTRO DE VEHÍCULO</div>
          </div>
          <p class="msg" id="msg" role="alert"></p>
          <button class="btn" id="go">
            Ingresar
            <svg
              width="28"
              height="28"
              viewBox="0 0 28 28"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 14h20M16 6l8 8-8 8" />
            </svg>
          </button>
        </section>
      </div>
    </main>
    <script>
      var $ = function (i) {
          return document.getElementById(i);
        },
        TOL = 15 * 60000,
        H = 3600000;
      function two(n) {
        return n < 10 ? "0" + n : "" + n;
      }
      function hhmm(t) {
        var d = new Date(t);
        return two(d.getHours()) + ":" + two(d.getMinutes());
      }
      function norm(p) {
        return String(p)
          .replace(/[^A-Za-z0-9]/g, "")
          .toUpperCase();
      }
      function fmtPlate(p) {
        var r = norm(p);
        return r.length > 3 ? r.slice(0, 3) + "-" + r.slice(3) : r;
      }

      /* Mismos datos que las otras páginas (mismo navegador / mismo dominio) */
      function ld(k) {
        try {
          var v = localStorage.getItem(k);
          return v ? JSON.parse(v) : null;
        } catch (e) {
          return null;
        }
      }
      function sv(k, v) {
        try {
          localStorage.setItem(k, JSON.stringify(v));
        } catch (e) {}
      }
      function seed() {
        var n = Date.now();
        return [
          {
            code: "SP-0001",
            plate: "DEMO1",
            spot: "A03",
            start: n - H,
            checkin: n - H,
            status: "in",
          },
          {
            code: "SP-0002",
            plate: "DEMO2",
            spot: "B02",
            start: n - 30 * 60000,
            checkin: n - 25 * 60000,
            status: "in",
          },
          {
            code: "SP-0003",
            plate: "DEMO3",
            spot: "A05",
            start: n + 30 * 60000,
            status: "reserved",
          },
          {
            code: "SP-0004",
            plate: "DEMO4",
            spot: "B04",
            start: n + H,
            status: "reserved",
          },
          {
            code: "SP-0005",
            plate: "DEMO5",
            spot: "C01",
            start: n - 2 * 60000,
            checkin: n - 60000,
            status: "in",
          },
          {
            code: "SP-0006",
            plate: "DEMO6",
            spot: "D06",
            start: n + 10 * 60000,
            status: "reserved",
          },
          {
            code: "SP-0007",
            plate: "DEMO7",
            spot: "E02",
            start: n - H * 2,
            checkin: n - H * 2,
            status: "in",
          },
          {
            code: "SP-0008",
            plate: "DEMO8",
            spot: "F08",
            start: n + 20 * 60000,
            status: "reserved",
          },
        ];
      }
      function all() {
        var r = ld("sp2_res");
        if (!r) {
          r = seed();
          sv("sp2_res", r);
        }
        return r;
      }
      function active(r) {
        if (
          r.status === "cancelled" ||
          r.status === "expired" ||
          r.status === "done"
        )
          return false;
        if (r.status === "reserved" && Date.now() > r.start + TOL) return false;
        return true;
      }
      function stateOf(id) {
        var st = "free";
        all().forEach(function (r) {
          if (r.spot === id && active(r)) {
            if (r.status === "in") st = "busy";
            else if (st !== "busy") st = "resv";
          }
        });
        return st;
      }
      function firstFree() {
        var L = "ABCDEF";
        for (var a = 0; a < 6; a++)
          for (var i = 1; i <= 8; i++) {
            var id = L[a] + "0" + i;
            if (stateOf(id) === "free") return id;
          }
        return null;
      }
      function isEmp(p) {
        return (ld("sp2_emp") || []).some(function (e) {
          return norm(e.plate) === norm(p);
        });
      }

      /* Entrada de placa */
      $("pin").addEventListener("input", function () {
        this.value = fmtPlate(this.value.slice(0, 8));
        $("plate").classList.remove("err");
        $("msg").textContent = "";
      });
      $("pin").addEventListener("keydown", function (e) {
        if (e.key === "Enter") go();
      });
      $("go").addEventListener("click", go);

      /* Al registrar, se abre el boleto (smartpark-boleto.html) */
      function show(r, dup) {
        sv("sp2_last", { code: r.code, dup: dup });
        location.href =
          "smartpark-boleto.html?b=" +
          encodeURIComponent(r.code) +
          (dup ? "&d=1" : "");
      }
      function fail(m) {
        $("plate").classList.add("err");
        $("msg").textContent = m;
        $("pin").focus();
      }

      function go() {
        var raw = norm($("pin").value);
        if (raw.length < 5) {
          fail("Escribe la placa completa (mínimo 5 caracteres).");
          return;
        }
        var a = all(),
          r = a.filter(function (x) {
            return active(x) && norm(x.plate) === raw;
          })[0];
        if (r && r.status === "in") {
          show(r, true);
          return;
        }
        if (r && r.status === "reserved") {
          if (Date.now() < r.start - TOL) {
            fail(
              "Tu reserva empieza a las " +
                hhmm(r.start) +
                ". El acceso abre 15 min antes.",
            );
            return;
          }
          r.status = "in";
          r.checkin = Date.now();
          sv("sp2_res", a);
          show(r, false);
          return;
        }
        var spot = firstFree();
        if (!spot) {
          fail("El estacionamiento está lleno por ahora.");
          return;
        }
        var n = Date.now(),
          w = {
            code: "SP-" + Math.floor(1000 + Math.random() * 9000),
            plate: fmtPlate(raw),
            spot: spot,
            start: n,
            checkin: n,
            status: "in",
            walkin: true,
          };
        a.push(w);
        sv("sp2_res", a);
        show(w, false);
      }

      $("pin").focus();
    </script>
  </body>
</html>
