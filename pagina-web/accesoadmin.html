<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SmartPark · Acceso administrador</title>
    <link rel="stylesheet" href="comun.css" />
    <link rel="stylesheet" href="accesoadmin.css" />
  </head>
  <body>
    <header>
      <div class="lg" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 34 34"
          fill="none"
          stroke="#111"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12l3-6h18l3 6" />
          <path d="M6 12h22v16H6z" />
          <path d="M11 28v-7h12v7" />
          <path d="M14 17h6" />
        </svg>
      </div>
      <div class="brand"><b>SMART</b><span>PARK</span></div>
      <small>ADMIN</small>
    </header>
    <main>
      <div class="card">
        <div class="ic" aria-hidden="true">
          <svg
            width="30"
            height="30"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#f5c400"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="11" width="16" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
        </div>
        <h1>Acceso Administrador</h1>
        <p class="lead">Ingresa tus credenciales para continuar</p>

        <label for="usr">Usuario</label>
        <div class="fld" id="fu">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg
          ><input
            id="usr"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            placeholder="admin"
          />
        </div>

        <label for="pwd">Contraseña</label>
        <div class="fld" id="fp">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="11" width="16" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg
          ><input
            id="pwd"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button
            type="button"
            class="eye"
            id="eye"
            aria-label="Mostrar contraseña"
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>

        <p class="msg" id="msg" role="alert"></p>
        <button class="btn" id="go">
          Iniciar sesión
          <svg
            width="26"
            height="26"
            viewBox="0 0 28 28"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 14h20M16 6l8 8-8 8" />
          </svg>
        </button>
        <a class="back" href="acceso.html">← Ir al acceso de clientes</a>
      </div>
    </main>
    <script src="accesoadmin.js"></script>
  </body>
</html>
