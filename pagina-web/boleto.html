<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SmartPark · Boleto de entrada</title>
    <style>
      :root {
        --card: #1c1d21;
        --ink: #fff;
        --mute: #a4a7ae;
        --line: #3a3b41;
        --yel: #f5c400;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        font-family:
          "Plus Jakarta Sans", "Segoe UI", Roboto, system-ui, sans-serif;
        background: #202125;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 10px;
        background: #111;
        border-bottom: 4px solid #f5c400;
      }
      .lg {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        background: #f5c400;
        display: grid;
        place-items: center;
        flex: none;
      }
      .brand {
        font-size: clamp(24px, 6vw, 28px);
        letter-spacing: 0.5px;
        line-height: 1;
      }
      .brand b {
        font-weight: 800;
        color: #f5c400;
      }
      .brand span {
        font-weight: 300;
        color: #fff;
      }
      header small {
        margin-left: auto;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #c8ccd2;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
        padding: 30px 16px 36px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 7vw, 36px);
        font-weight: 800;
      }
      .lead {
        margin: 0;
        color: var(--mute);
        font-size: clamp(14px, 3.8vw, 17px);
      }
      .okc {
        width: 68px;
        height: 68px;
        margin: 0 auto 14px;
        border-radius: 50%;
        background: rgba(61, 220, 151, 0.14);
        border: 2px solid #2f8f6f;
        display: grid;
        place-items: center;
      }
      .tk {
        position: relative;
        margin: 24px 0 16px;
        background: #fff;
        border: 3px solid #f5c400;
        border-radius: 28px;
        padding: 22px;
        color: #1c2333;
        text-align: left;
        box-shadow: 0 0 30px rgba(245, 196, 0, 0.15);
      }
      .tk small {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #8d99ad;
      }
      .tkh {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 10px;
      }
      .mono {
        font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
      }
      .tkh .mono {
        font-size: clamp(18px, 5vw, 22px);
        font-weight: 700;
      }
      .pill {
        background: #f5c400;
        color: #26272b;
        font-weight: 800;
        font-size: 14px;
        padding: 7px 14px;
        border-radius: 12px;
      }
      .hr {
        border-top: 1.5px solid #e3e6ec;
        margin: 14px 0 16px;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
      }
      .bx {
        background: #f6f8fb;
        border: 1px solid #e6eaf0;
        border-radius: 16px;
        padding: 12px 14px;
      }
      .g2 .bx {
        margin: 0;
      }
      .bx b {
        display: block;
        margin-top: 4px;
        font:
          700 clamp(21px, 6vw, 28px)/1.2 ui-monospace,
          "JetBrains Mono",
          Menlo,
          Consolas,
          monospace;
      }
      .bx em {
        display: block;
        font-style: normal;
        font-size: 12px;
        color: #8a4b0f;
      }
      .cj {
        background: #fff8d8;
        border-color: #f3df8a;
      }
      .cj small {
        color: #8a4b0f;
      }
      .cj b {
        color: #d9820d;
        font-size: clamp(26px, 8vw, 36px);
      }
      .tag {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 8px;
        border-radius: 20px;
        background: #26272b;
        color: #f5c400;
        font-size: 10px;
        font-weight: 800;
      }
      .tear {
        position: relative;
        border-top: 2px dashed #d5d8de;
        margin: 18px 0;
      }
      .tear::before,
      .tear::after {
        content: "";
        position: absolute;
        top: -19px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #202125;
      }
      .tear::before {
        left: -43px;
      }
      .tear::after {
        right: -43px;
      }
      .tear.t2::before,
      .tear.t2::after {
        display: none;
      }
      .gap {
        height: 84px;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        height: 60px;
        border: 0;
        border-radius: 18px;
        font: 800 20px inherit;
        font-family: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:focus-visible {
        outline: 3px solid #f5c400;
        outline-offset: 3px;
      }
      .dl {
        background: #26272b;
        color: #fff;
      }
      .ghost {
        background: #232428;
        color: #fff;
        border: 1.5px solid var(--line);
      }
      .empty {
        margin-top: 30px;
      }
      .empty .lead {
        margin-bottom: 24px;
      }
      .hidden {
        display: none !important;
      }
      @media (min-width: 700px) {
        main {
          padding-top: 48px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="lg" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 34 34"
          fill="none"
          stroke="#111"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12l3-6h18l3 6" />
          <path d="M6 12h22v16H6z" />
          <path d="M11 28v-7h12v7" />
          <path d="M14 17h6" />
        </svg>
      </div>
      <div class="brand"><b>SMART</b><span>PARK</span></div>
      <small>BOLETO</small>
    </header>
    <main>
      <section id="ok" class="hidden">
        <div class="okc">
          <svg
            width="34"
            height="34"
            viewBox="0 0 38 38"
            fill="none"
            stroke="#3ddc97"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 20l8 8 14-16" />
          </svg>
        </div>
        <h1 id="rTitle">¡Ingreso Exitoso!</h1>
        <p class="lead" id="rSub">Conserva este boleto digital</p>
        <div class="tk">
          <div class="tkh">
            <div><small>BOLETO #</small><b class="mono" id="rCode"></b></div>
            <span class="pill">ENTRADA</span>
          </div>
          <div class="hr"></div>
          <div class="g2">
            <div class="bx">
              <small id="plLbl">Placa Registrada</small><b id="rPlate"></b>
            </div>
            <div class="bx cj">
              <small>Cajón Asignado</small><b id="rSpot"></b
              ><em id="rArea"></em>
            </div>
          </div>
          <div class="bx"><small>Hora de Entrada</small><b id="rTime"></b></div>
          <div class="tear"></div>
          <div class="gap"></div>
          <div class="tear t2"></div>
          <button class="btn dl" id="dl">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3v12M7 10l5 5 5-5M4 20h16" /></svg
            >Descargar Ticket
          </button>
        </div>
        <a class="btn ghost" href="smartpark-acceso.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
          >
            <path d="M12 5v14M5 12h14" /></svg
          >Registrar Otra Placa</a
        >
      </section>

      <section id="none" class="empty hidden">
        <h1>Sin boleto</h1>
        <p class="lead">
          No encontramos una entrada registrada. Ingresa tu placa para generar
          tu boleto.
        </p>
        <a
          class="btn dl"
          href="smartpark-acceso.html"
          style="background: #f5c400; color: #26272b"
          >Ir a registrar placa</a
        >
      </section>
    </main>
    <script>
      var $ = function (i) {
        return document.getElementById(i);
      };
      function ld(k) {
        try {
          var v = localStorage.getItem(k);
          return v ? JSON.parse(v) : null;
        } catch (e) {
          return null;
        }
      }
      function norm(p) {
        return String(p)
          .replace(/[^A-Za-z0-9]/g, "")
          .toUpperCase();
      }
      function fmtPlate(p) {
        var r = norm(p);
        return r.length > 3 ? r.slice(0, 3) + "-" + r.slice(3) : r;
      }

      /* El boleto se busca por el código que manda la pantalla de acceso */
      var q = new URLSearchParams(location.search),
        code = q.get("b"),
        dup = q.get("d") === "1";
      if (!code) {
        var l = ld("sp2_last");
        if (l) {
          code = l.code;
          dup = !!l.dup;
        }
      }
      var cur =
        code &&
        (ld("sp2_res") || []).filter(function (x) {
          return x.code === code && x.checkin;
        })[0];

      if (!cur) {
        $("none").classList.remove("hidden");
      } else {
        $("ok").classList.remove("hidden");
        if (dup) {
          $("rTitle").textContent = "Ya estás dentro";
          $("rSub").textContent = "Este es tu boleto digital";
        }
        $("rCode").textContent = cur.code;
        $("rPlate").textContent = fmtPlate(cur.plate);
        if (
          (ld("sp2_emp") || []).some(function (e) {
            return norm(e.plate) === norm(cur.plate);
          })
        ) {
          var t = document.createElement("span");
          t.className = "tag";
          t.textContent = "EMPLEADO";
          $("plLbl").appendChild(t);
        }
        $("rSpot").textContent = cur.spot.charAt(0) + "-" + cur.spot.slice(1);
        $("rArea").textContent = "Área " + cur.spot.charAt(0) + " · Nivel 1";
        $("rTime").textContent = new Date(cur.checkin).toLocaleTimeString(
          "es-MX",
          {
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true,
          },
        );
      }

      /* Descargar el boleto como imagen PNG */
      $("dl").addEventListener("click", function () {
        if (!cur) return;
        var c = document.createElement("canvas"),
          W = 720,
          Hh = 800,
          x = c.getContext("2d"),
          M = "ui-monospace,Menlo,Consolas,monospace";
        c.width = W;
        c.height = Hh;
        x.fillStyle = "#fff";
        x.fillRect(0, 0, W, Hh);
        x.strokeStyle = "#f5c400";
        x.lineWidth = 14;
        x.strokeRect(7, 7, W - 14, Hh - 14);
        x.textAlign = "center";
        x.fillStyle = "#111";
        x.font = "800 54px system-ui,sans-serif";
        x.fillText("SMARTPARK", W / 2, 110);
        x.fillStyle = "#8d99ad";
        x.font = "600 26px system-ui,sans-serif";
        x.fillText("Boleto digital de entrada", W / 2, 155);
        x.textAlign = "left";
        function line(l, v, y, col, sz) {
          x.fillStyle = "#8d99ad";
          x.font = "600 24px system-ui,sans-serif";
          x.fillText(l, 70, y);
          x.fillStyle = col || "#1c2333";
          x.font = "700 " + (sz || 44) + "px " + M;
          x.fillText(v, 70, y + 52);
        }
        line("BOLETO #", cur.code, 250);
        line("PLACA REGISTRADA", fmtPlate(cur.plate), 370);
        line(
          "CAJÓN ASIGNADO",
          cur.spot.charAt(0) + "-" + cur.spot.slice(1),
          490,
          "#d9820d",
          64,
        );
        line("HORA DE ENTRADA", $("rTime").textContent, 640);
        var a = document.createElement("a");
        a.href = c.toDataURL("image/png");
        a.download = "ticket-" + cur.code + ".png";
        document.body.appendChild(a);
        a.click();
        a.remove();
      });
    </script>
  </body>
</html>
