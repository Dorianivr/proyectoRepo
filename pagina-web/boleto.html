<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SmartPark · Boleto de entrada</title>
    <link rel="stylesheet" href="comun.css" />
    <link rel="stylesheet" href="boleto.css" />
  </head>
  <body>
    <header>
      <div class="lg" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 34 34"
          fill="none"
          stroke="#111"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12l3-6h18l3 6" />
          <path d="M6 12h22v16H6z" />
          <path d="M11 28v-7h12v7" />
          <path d="M14 17h6" />
        </svg>
      </div>
      <div class="brand"><b>SMART</b><span>PARK</span></div>
      <small>BOLETO</small>
    </header>
    <main>
      <section id="ok" class="hidden">
        <div class="okc">
          <svg
            width="34"
            height="34"
            viewBox="0 0 38 38"
            fill="none"
            stroke="#3ddc97"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 20l8 8 14-16" />
          </svg>
        </div>
        <h1 id="rTitle">¡Ingreso Exitoso!</h1>
        <p class="lead" id="rSub">Conserva este boleto digital</p>
        <div class="tk">
          <div class="tkh">
            <div><small>BOLETO #</small><b class="mono" id="rCode"></b></div>
            <span class="pill">ENTRADA</span>
          </div>
          <div class="hr"></div>
          <div class="g2">
            <div class="bx">
              <small id="plLbl">Placa Registrada</small><b id="rPlate"></b>
            </div>
            <div class="bx cj">
              <small>Cajón Asignado</small><b id="rSpot"></b
              ><em id="rArea"></em>
            </div>
          </div>
          <div class="bx"><small>Hora de Entrada</small><b id="rTime"></b></div>
          <div class="tear"></div>
          <div class="gap"></div>
          <div class="tear t2"></div>
          <button class="btn dl" id="dl">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3v12M7 10l5 5 5-5M4 20h16" /></svg
            >Descargar Ticket
          </button>
        </div>
        <a class="btn ghost" href="acceso.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
          >
            <path d="M12 5v14M5 12h14" /></svg
          >Registrar Otra Placa</a
        >
        <a class="btn ghost" href="RESERVACIONES.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M3 10h18M8 3v4M16 3v4" /></svg
          >Reservar un Cajón</a
        >
      </section>

      <section id="none" class="empty hidden">
        <h1>Sin boleto</h1>
        <p class="lead">
          No encontramos una entrada registrada. Ingresa tu placa para generar
          tu boleto.
        </p>
        <a
          class="btn dl"
          href="acceso.html"
          style="background: #f5c400; color: #26272b"
          >Ir a registrar placa</a
        >
      </section>
    </main>
    <script src="datos.js"></script>
    <script src="boleto.js"></script>
  </body>
</html>
