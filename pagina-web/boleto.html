<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>SmartPark · Boleto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="comun.css" />
    <link rel="stylesheet" href="boleto.css" />
  </head>
  <body data-tab="boleto">
    <header data-sub="BOLETO"></header>
    <main class="wrap">
      <section id="ok" class="hidden">
        <div class="okc" aria-hidden="true">
          <svg width="34" height="34" viewBox="0 0 38 38" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20l8 8 14-16" /></svg>
        </div>
        <h1 id="rTitle">¡Ingreso exitoso!</h1>
        <p class="lead" id="rSub">Conserva este boleto digital</p>

        <div class="tk">
          <div class="tkh">
            <div><small>BOLETO #</small><b class="mono" id="rCode"></b></div>
            <span class="pill" id="rPill">ENTRADA</span>
          </div>
          <div class="hr"></div>
          <div class="g2">
            <div class="bx"><small id="plLbl">Placa registrada</small><b id="rPlate"></b></div>
            <div class="bx cj"><small>Cajón asignado</small><b id="rSpot"></b><em id="rArea"></em></div>
          </div>
          <div class="bx"><small>Hora de entrada</small><b id="rTime"></b></div>
          <div class="g2 g2b">
            <div class="bx"><small>Tiempo dentro</small><b id="rDur"></b></div>
            <div class="bx tot"><small id="rTotLbl">Total a pagar</small><b id="rTotal"></b></div>
          </div>
          <div class="tear"></div>
          <div class="barcode" id="bar"></div>
          <div class="barnum mono" id="barNum"></div>
          <div class="tear t2"></div>
          <button class="btn block dl" id="dl" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16" /></svg>
            Descargar ticket
          </button>
        </div>

        <!-- Pago -->
        <div class="card pay" id="payBox" aria-live="polite"></div>
      </section>

      <section id="none" class="empty hidden">
        <h1>Sin boleto</h1>
        <p class="lead">No encontramos una entrada registrada. Ingresa tu placa para generar tu boleto.</p>
        <a class="btn block" href="acceso.html">Ir a registrar placa</a>
      </section>
    </main>

    <script src="datos.js"></script>
    <script src="boleto.js"></script>
  </body>
</html>
