<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <script src="guardia.js"></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SmartPark · Administrador</title>
    <link rel="stylesheet" href="comun.css" />
    <link rel="stylesheet" href="ADMINISTRADOR.css" />
  </head>
  <body>
    <header>
      <button class="ic" id="menuBtn" aria-label="Menú" aria-expanded="false">
        <svg
          width="40"
          height="32"
          viewBox="0 0 40 32"
          fill="none"
          stroke="currentColor"
          stroke-width="5"
          stroke-linecap="round"
        >
          <path d="M4 5h32M4 16h32M4 27h32" />
        </svg>
      </button>

      <div class="lg" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 34 34"
          fill="none"
          stroke="#111"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12l3-6h18l3 6" />
          <path d="M6 12h22v16H6z" />
          <path d="M11 28v-7h12v7" />
          <path d="M14 17h6" />
        </svg>
      </div>
      <div class="brand"><b>SMART</b><span>PARK</span></div>
      <div class="hdr-r">
        <a
          class="ic"
          href="#entradas"
          aria-label="Estadísticas"
          style="color: var(--teal); display: flex"
          ><svg
            width="38"
            height="34"
            viewBox="0 0 38 34"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 3v28h32" />
            <path d="M9 26v-8M16 26v-13M23 26v-9M30 26v-17" />
            <path d="M8 12l9-6 6 4 10-8" /></svg></a
        ><button
          class="lo"
          id="logout"
          type="button"
          aria-label="Cerrar sesión"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
            /></svg
          ><span>Salir</span>
        </button>
      </div>
      <nav id="nav" class="hidden" aria-label="Secciones">
        <a href="#entradas">Entradas</a><a href="#libres">Cajones libres</a
        ><a href="#reservar">Reservar cajón</a
        ><a href="#activas">Reservas activas</a
        ><a href="#empleados">Placas de empleados</a>
      </nav>
    </header>
    <main>
      <section class="sec" id="entradas">
        <h2>Entradas</h2>
        <div class="card">
          <svg
            viewBox="0 0 400 200"
            id="chart"
            role="img"
            aria-label="Entradas por día de la semana"
          ></svg>
        </div>
      </section>

      <section class="sec" id="libres">
        <h2>Cajones<br />Libres</h2>
        <div class="card">
          <div class="kpis" id="kpis"></div>
          <div id="free"></div>
        </div>
      </section>

      <section class="sec" id="reservar">
        <h2>Reservar<br />Cajón</h2>
        <div class="card">
          <div class="form">
            <div>
              <label for="selCajon">Selecciona cajón</label
              ><select id="selCajon" class="fld"></select>
            </div>
            <div>
              <label for="resPlate">Mete placas</label
              ><input
                id="resPlate"
                class="fld"
                maxlength="9"
                placeholder="ABC 123"
                autocomplete="off"
                style="text-transform: uppercase"
              />
            </div>
            <button class="btn full" id="resBtn">Reservar</button>
          </div>
          <p class="msg" id="resMsg" role="alert"></p>
        </div>
      </section>

      <section class="sec" id="activas">
        <h2>Reservas<br />Activas</h2>
        <div class="card">
          <div class="tw">
            <table>
              <thead>
                <tr>
                  <th>Cajón</th>
                  <th>Placa</th>
                  <th>Estado</th>
                  <th>Hora</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="act"></tbody>
            </table>
          </div>
          <p class="msg" id="actMsg" role="status"></p>
        </div>
      </section>

      <section class="sec" id="empleados">
        <h2>Placas<br />Empleados</h2>
        <div class="card">
          <div class="form">
            <div>
              <label for="empName">Nombre</label
              ><input
                id="empName"
                class="fld"
                maxlength="40"
                autocomplete="off"
              />
            </div>
            <div>
              <label for="empPlate">Placas</label
              ><input
                id="empPlate"
                class="fld"
                maxlength="9"
                placeholder="ABC 123"
                autocomplete="off"
                style="text-transform: uppercase"
              />
            </div>
            <button class="btn full" id="empBtn">Registrar empleado</button>
          </div>
          <p class="msg" id="empMsg" role="alert"></p>
          <div class="tw">
            <table>
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Placas</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="emp"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
    <dialog id="dlg" aria-labelledby="dTitle">
      <div class="dh">
        <div class="dw" aria-hidden="true">!</div>
        <h3 id="dTitle"></h3>
      </div>
      <div class="db" id="dBody"></div>
      <div class="da">
        <button class="btn out" id="dNo" type="button">No, volver</button
        ><button class="btn" id="dOk" type="button"></button>
      </div>
    </dialog>
    <script src="datos.js"></script>
    <script src="ADMINISTRADOR.js"></script>
  </body>
</html>
