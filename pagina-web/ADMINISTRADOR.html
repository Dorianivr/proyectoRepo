<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SmartPark · Administrador</title>
    <style>
      :root {
        --bg: #f2f2f2;
        --card: #fff;
        --ink: #111;
        --mute: #555;
        --line: #d0d0d0;
        --teal: #f5c400;
        --teal2: #4a4a4a;
        --btn: #f5c400;
        --bad: #111;
        --ok: #111;
        --soft: #e8e8e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0d0d;
          --card: #1b1b1b;
          --ink: #f5f5f5;
          --mute: #b0b0b0;
          --line: #3a3a3a;
          --teal: #f5c400;
          --teal2: #6b6b6b;
          --btn: #f5c400;
          --soft: #2a2a2a;
          --bad: #f5f5f5;
          --ok: #f5f5f5;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: #111;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 10px;
        border-bottom: 4px solid #f5c400;
      }
      header button.ic {
        background: none;
        border: 0;
        padding: 6px;
        cursor: pointer;
        border-radius: 8px;
        color: var(--teal);
        display: flex;
      }
      header button.ic:focus-visible,
      .btn:focus-visible,
      .chip:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      .logo {
        font-size: clamp(24px, 6vw, 28px);
        letter-spacing: 0.5px;
        line-height: 1;
      }
      .lg {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        background: #f5c400;
        display: grid;
        place-items: center;
        flex: none;
      }
      .logo b {
        font-weight: 800;
        color: #f5c400;
      }
      .logo span {
        font-weight: 300;
        color: #fff;
      }
      header .ic:focus-visible {
        outline-color: #fff;
      }
      nav {
        position: absolute;
        top: 100%;
        left: 12px;
        background: var(--card);
        border: 1.5px solid var(--line);
        border-radius: 12px;
        padding: 6px;
        min-width: 220px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }
      nav a {
        display: block;
        padding: 10px 14px;
        color: var(--ink);
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
      }
      nav a:hover {
        background: var(--soft);
      }
      .hidden {
        display: none !important;
      }
      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 20px 18px 40px;
      }
      .sec {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
        margin-bottom: 24px;
        scroll-margin-top: 90px;
      }
      .sec > h2 {
        font-size: 27px;
        font-weight: 600;
        margin: 8px 0;
        line-height: 1.15;
      }
      .card {
        background: var(--card);
        border: 1.5px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .gl {
        stroke: var(--line);
        stroke-width: 1;
      }
      .ax {
        fill: var(--mute);
        font-size: 11px;
      }
      .bar {
        fill: var(--teal2);
      }
      .bar.today {
        fill: var(--teal);
        stroke: #111;
        stroke-width: 1.5;
      }
      .bv {
        fill: var(--ink);
        font-size: 11px;
        font-weight: 700;
        text-anchor: middle;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }
      .kpi {
        background: var(--soft);
        border-radius: 10px;
        padding: 8px 10px;
        text-align: center;
        font-size: 12px;
        color: var(--mute);
      }
      .kpi b {
        display: block;
        font-size: 24px;
        color: var(--ink);
      }
      .ag {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .ag:first-of-type {
        border-top: 0;
      }
      .ag > b {
        width: 64px;
        flex: none;
        padding-top: 6px;
        font-size: 14px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chips em {
        color: var(--mute);
        font-size: 13px;
        padding-top: 6px;
      }
      .chip {
        border: 0;
        border-radius: 8px;
        background: #3a3a3a;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .chip:hover {
        background: #f5c400;
        color: #111;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 0 0 4px;
        font-size: 15px;
      }
      .fld {
        width: 100%;
        height: 44px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        padding: 0 12px;
        margin-bottom: 12px;
      }
      .fld:focus {
        outline: 0;
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.45);
      }
      .btn {
        background: var(--btn);
        color: #111;
        border: 0;
        border-radius: 10px;
        height: 44px;
        padding: 0 22px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .btn.sm {
        height: 34px;
        padding: 0 12px;
        font-size: 13px;
      }
      .btn.out {
        background: transparent;
        color: var(--ink);
        border: 1.5px solid var(--line);
      }
      .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
      }
      .form .full {
        grid-column: 1/-1;
      }
      .form .btn {
        justify-self: end;
      }
      .msg {
        min-height: 20px;
        margin: 6px 0 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--bad);
      }
      .msg.ok {
        color: var(--ok);
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      th {
        text-align: left;
        color: var(--mute);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 8px;
        border-bottom: 1.5px solid var(--line);
      }
      td {
        padding: 9px 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      tr:last-child td {
        border: 0;
      }
      td.mono {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 1px;
      }
      td.act {
        text-align: right;
      }
      td.act .btn {
        margin-left: 6px;
      }
      .tag {
        display: inline-block;
        border-radius: 20px;
        padding: 2px 10px;
        font-size: 12px;
        font-weight: 700;
      }
      .tag.r {
        background: #f5c400;
        color: #111;
      }
      .tag.o {
        background: #3a3a3a;
        color: #fff;
      }
      .tag.e {
        background: #111;
        color: #f5c400;
        border: 1px solid #f5c400;
        margin-left: 6px;
      }
      .empty {
        color: var(--mute);
        text-align: center;
        padding: 14px 0;
        font-size: 14px;
      }
      dialog {
        border: 0;
        padding: 0;
        border-radius: 18px;
        max-width: 420px;
        width: calc(100% - 32px);
        background: var(--card);
        color: var(--ink);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.65);
      }
      .dh {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 20px 20px 6px;
      }
      .dh h3 {
        margin: 0;
        font-size: 20px;
      }
      .dw {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #f5c400;
        color: #111;
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 24px;
        flex: none;
      }
      .db {
        padding: 8px 20px 4px;
        font-size: 16px;
        line-height: 1.5;
        color: var(--ink);
      }
      .da {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 16px 20px 20px;
      }
      .da .btn {
        height: 48px;
        padding: 0 10px;
      }
      @media (max-width: 760px) {
        .sec {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .sec > h2 {
          font-size: 21px;
          margin: 4px 0;
        }
        .form {
          grid-template-columns: 1fr;
        }
        .main {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <button class="ic" id="menuBtn" aria-label="Menú" aria-expanded="false">
        <svg
          width="40"
          height="32"
          viewBox="0 0 40 32"
          fill="none"
          stroke="currentColor"
          stroke-width="5"
          stroke-linecap="round"
        >
          <path d="M4 5h32M4 16h32M4 27h32" />
        </svg>
      </button>

      <div class="lg" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 34 34"
          fill="none"
          stroke="#111"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12l3-6h18l3 6" />
          <path d="M6 12h22v16H6z" />
          <path d="M11 28v-7h12v7" />
          <path d="M14 17h6" />
        </svg>
      </div>
      <div class="logo"><b>SMART</b><span>PARK</span></div>
      <a
        class="ic"
        href="#entradas"
        aria-label="Estadísticas"
        style="color: var(--teal); display: flex; margin-left: auto"
        ><svg
          width="38"
          height="34"
          viewBox="0 0 38 34"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3v28h32" />
          <path d="M9 26v-8M16 26v-13M23 26v-9M30 26v-17" />
          <path d="M8 12l9-6 6 4 10-8" /></svg
      ></a>
      <nav id="nav" class="hidden" aria-label="Secciones">
        <a href="#entradas">Entradas</a><a href="#libres">Cajones libres</a
        ><a href="#reservar">Reservar cajón</a
        ><a href="#activas">Reservas activas</a
        ><a href="#empleados">Placas de empleados</a>
      </nav>
    </header>
    <main>
      <section class="sec" id="entradas">
        <h2>Entradas</h2>
        <div class="card">
          <svg
            viewBox="0 0 400 200"
            id="chart"
            role="img"
            aria-label="Entradas por día de la semana"
          ></svg>
        </div>
      </section>

      <section class="sec" id="libres">
        <h2>Cajones<br />Libres</h2>
        <div class="card">
          <div class="kpis" id="kpis"></div>
          <div id="free"></div>
        </div>
      </section>

      <section class="sec" id="reservar">
        <h2>Reservar<br />Cajón</h2>
        <div class="card">
          <div class="form">
            <div>
              <label for="selCajon">Selecciona cajón</label
              ><select id="selCajon" class="fld"></select>
            </div>
            <div>
              <label for="resPlate">Mete placas</label
              ><input
                id="resPlate"
                class="fld"
                maxlength="9"
                placeholder="ABC 123"
                autocomplete="off"
                style="text-transform: uppercase"
              />
            </div>
            <button class="btn full" id="resBtn">Reservar</button>
          </div>
          <p class="msg" id="resMsg" role="alert"></p>
        </div>
      </section>

      <section class="sec" id="activas">
        <h2>Reservas<br />Activas</h2>
        <div class="card">
          <div class="tw">
            <table>
              <thead>
                <tr>
                  <th>Cajón</th>
                  <th>Placa</th>
                  <th>Estado</th>
                  <th>Hora</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="act"></tbody>
            </table>
          </div>
          <p class="msg" id="actMsg" role="status"></p>
        </div>
      </section>

      <section class="sec" id="empleados">
        <h2>Placas<br />Empleados</h2>
        <div class="card">
          <div class="form">
            <div>
              <label for="empName">Nombre</label
              ><input
                id="empName"
                class="fld"
                maxlength="40"
                autocomplete="off"
              />
            </div>
            <div>
              <label for="empPlate">Placas</label
              ><input
                id="empPlate"
                class="fld"
                maxlength="9"
                placeholder="ABC 123"
                autocomplete="off"
                style="text-transform: uppercase"
              />
            </div>
            <button class="btn full" id="empBtn">Registrar empleado</button>
          </div>
          <p class="msg" id="empMsg" role="alert"></p>
          <div class="tw">
            <table>
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Placas</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="emp"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
    <dialog id="dlg" aria-labelledby="dTitle">
      <div class="dh">
        <div class="dw" aria-hidden="true">!</div>
        <h3 id="dTitle"></h3>
      </div>
      <div class="db" id="dBody"></div>
      <div class="da">
        <button class="btn out" id="dNo" type="button">No, volver</button
        ><button class="btn" id="dOk" type="button"></button>
      </div>
    </dialog>
    <script>
      var $ = function (i) {
          return document.getElementById(i);
        },
        TOL = 15 * 60000,
        RATE = 15,
        H = 3600000;
      var AREAS = [
        { id: "A", n: "Área A", c: "#2f6fed" },
        { id: "B", n: "Área B", c: "#1f9d55" },
        { id: "C", n: "Área C", c: "#d63b3b" },
        { id: "D", n: "Área D", c: "#8e4ee0" },
        { id: "E", n: "Área E", c: "#c9661a" },
        { id: "F", n: "Área F", c: "#0f8a90" },
      ];
      function ids(a) {
        var o = [];
        for (var i = 1; i <= 8; i++) o.push(a + "0" + i);
        return o;
      }
      function two(n) {
        return n < 10 ? "0" + n : "" + n;
      }
      function hhmm(t) {
        var d = new Date(t);
        return two(d.getHours()) + ":" + two(d.getMinutes());
      }
      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }

      /* Mismos datos que la página del usuario (mismo navegador / mismo dominio) */
      function ld(k) {
        try {
          var v = localStorage.getItem(k);
          return v ? JSON.parse(v) : null;
        } catch (e) {
          return null;
        }
      }
      function sv(k, v) {
        try {
          localStorage.setItem(k, JSON.stringify(v));
        } catch (e) {}
      }
      function seed() {
        var n = Date.now();
        return [
          {
            code: "SP-0001",
            plate: "DEMO1",
            spot: "A03",
            start: n - H,
            checkin: n - H,
            status: "in",
          },
          {
            code: "SP-0002",
            plate: "DEMO2",
            spot: "B02",
            start: n - 30 * 60000,
            checkin: n - 25 * 60000,
            status: "in",
          },
          {
            code: "SP-0003",
            plate: "DEMO3",
            spot: "A05",
            start: n + 30 * 60000,
            status: "reserved",
          },
          {
            code: "SP-0004",
            plate: "DEMO4",
            spot: "B04",
            start: n + H,
            status: "reserved",
          },
          {
            code: "SP-0005",
            plate: "DEMO5",
            spot: "C01",
            start: n - 2 * 60000,
            checkin: n - 60000,
            status: "in",
          },
          {
            code: "SP-0006",
            plate: "DEMO6",
            spot: "D06",
            start: n + 10 * 60000,
            status: "reserved",
          },
          {
            code: "SP-0007",
            plate: "DEMO7",
            spot: "E02",
            start: n - H * 2,
            checkin: n - H * 2,
            status: "in",
          },
          {
            code: "SP-0008",
            plate: "DEMO8",
            spot: "F08",
            start: n + 20 * 60000,
            status: "reserved",
          },
        ];
      }
      function all() {
        var r = ld("sp2_res");
        if (!r) {
          r = seed();
          sv("sp2_res", r);
        }
        return r;
      }
      function emps() {
        return ld("sp2_emp") || [];
      }
      function active(r) {
        if (
          r.status === "cancelled" ||
          r.status === "expired" ||
          r.status === "done"
        )
          return false;
        if (r.status === "reserved" && Date.now() > r.start + TOL) return false;
        return true;
      }
      function stateOf(id) {
        var st = "free";
        all().forEach(function (r) {
          if (r.spot === id && active(r)) {
            if (r.status === "in") st = "busy";
            else if (st !== "busy") st = "resv";
          }
        });
        return st;
      }
      function isEmp(p) {
        return emps().some(function (e) {
          return e.plate === p;
        });
      }

      /* ---- Gráfica de entradas por día ---- */
      function renderChart() {
        var h = ld("sp2_hist");
        if (!h) {
          h = [38, 24, 41, 22, 35, 47, 52];
          sv("sp2_hist", h);
        }
        h = h.slice();
        var now = new Date(),
          idx = (now.getDay() + 6) % 7,
          t0 = new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate(),
          ).getTime(),
          today = 0;
        all().forEach(function (r) {
          if (r.checkin && r.checkin >= t0) today++;
        });
        h[idx] += today;
        var top = Math.ceil((Math.max.apply(null, h) + 1) / 10) * 10,
          x0 = 46,
          y0 = 170,
          ph = 140,
          pw = 340,
          st = pw / 7,
          bw = 30,
          D = ["L", "M", "M", "J", "V", "S", "D"],
          s = "";
        for (var k = 0; k <= 4; k++) {
          var y = y0 - (ph * k) / 4;
          s +=
            '<line class="gl" x1="' +
            x0 +
            '" x2="' +
            (x0 + pw) +
            '" y1="' +
            y +
            '" y2="' +
            y +
            '"/><text class="ax" x="' +
            (x0 - 6) +
            '" y="' +
            (y + 4) +
            '" text-anchor="end">' +
            Math.round((top * k) / 4) +
            "</text>";
        }
        h.forEach(function (v, i) {
          var bh = (ph * v) / top,
            x = x0 + st * i + (st - bw) / 2;
          s +=
            '<rect class="bar' +
            (i === idx ? " today" : "") +
            '" x="' +
            x +
            '" y="' +
            (y0 - bh) +
            '" width="' +
            bw +
            '" height="' +
            bh +
            '" rx="3"><title>' +
            v +
            " entradas</title></rect>" +
            '<text class="bv" x="' +
            (x + bw / 2) +
            '" y="' +
            (y0 - bh - 4) +
            '">' +
            v +
            '</text><text class="ax" style="font-size:13px;font-weight:' +
            (i === idx ? 700 : 400) +
            '" x="' +
            (x + bw / 2) +
            '" y="190" text-anchor="middle">' +
            D[i] +
            "</text>";
        });
        s +=
          '<text class="ax" transform="rotate(-90 11 100)" x="11" y="100" text-anchor="middle">Vehículos</text>';
        $("chart").innerHTML = s;
      }

      /* ---- Cajones libres ---- */
      function renderFree() {
        var free = 0,
          resv = 0,
          busy = 0,
          h = "";
        AREAS.forEach(function (a) {
          var f = [];
          ids(a.id).forEach(function (i) {
            var s = stateOf(i);
            if (s === "free") {
              free++;
              f.push(i);
            } else if (s === "resv") resv++;
            else busy++;
          });
          h +=
            '<div class="ag"><b>' +
            a.n +
            '</b><div class="chips">' +
            (f.length
              ? f
                  .map(function (i) {
                    return (
                      '<button class="chip" data-id="' +
                      i +
                      '">' +
                      i +
                      "</button>"
                    );
                  })
                  .join("")
              : "<em>Sin cajones libres</em>") +
            "</div></div>";
        });
        $("free").innerHTML = h;
        $("kpis").innerHTML =
          '<div class="kpi"><b>' +
          free +
          '</b>Libres</div><div class="kpi"><b>' +
          resv +
          '</b>Reservados</div><div class="kpi"><b>' +
          busy +
          "</b>Ocupados</div>";
        var cur = $("selCajon").value,
          o = '<option value="">Selecciona cajón</option>';
        AREAS.forEach(function (a) {
          var f = ids(a.id).filter(function (i) {
            return stateOf(i) === "free";
          });
          if (f.length)
            o +=
              '<optgroup label="' +
              a.n +
              '">' +
              f
                .map(function (i) {
                  return "<option>" + i + "</option>";
                })
                .join("") +
              "</optgroup>";
        });
        $("selCajon").innerHTML = o;
        if (cur && stateOf(cur) === "free") $("selCajon").value = cur;
      }
      $("free").addEventListener("click", function (e) {
        var b = e.target.closest(".chip");
        if (!b) return;
        $("selCajon").value = b.dataset.id;
        $("reservar").scrollIntoView({ behavior: "smooth" });
        $("resPlate").focus({ preventScroll: true });
      });

      /* ---- Reservar ---- */
      $("resPlate").addEventListener("input", function () {
        this.value = this.value.replace(/[^A-Za-z0-9 -]/g, "");
      });
      $("resBtn").addEventListener("click", function () {
        var sp = $("selCajon").value,
          pl = $("resPlate").value.trim().toUpperCase(),
          m = $("resMsg");
        m.className = "msg";
        if (!sp) {
          m.textContent = "Selecciona un cajón.";
          return;
        }
        if (pl.length < 5) {
          m.textContent = "Escribe la placa completa (mínimo 5 caracteres).";
          return;
        }
        if (stateOf(sp) !== "free") {
          m.textContent = "Ese cajón ya no está libre.";
          renderAll();
          return;
        }
        var a = all(),
          code = "SP-" + Math.floor(1000 + Math.random() * 9000);
        a.push({
          code: code,
          plate: pl,
          spot: sp,
          start: Date.now(),
          status: "reserved",
        });
        sv("sp2_res", a);
        $("resPlate").value = "";
        m.className = "msg ok";
        m.textContent =
          "Cajón " +
          sp +
          " reservado para " +
          pl +
          " (código " +
          code +
          "). Tiene 15 min para llegar.";
        renderAll();
      });

      /* ---- Reservas activas ---- */
      function renderActive() {
        var rows = all()
          .filter(active)
          .sort(function (a, b) {
            return a.spot < b.spot ? -1 : 1;
          });
        $("act").innerHTML = rows.length
          ? rows
              .map(function (r) {
                var inn = r.status === "in";
                return (
                  "<tr><td><b>" +
                  r.spot +
                  '</b></td><td class="mono">' +
                  esc(r.plate) +
                  (isEmp(r.plate)
                    ? '<span class="tag e">Empleado</span>'
                    : "") +
                  '</td><td><span class="tag ' +
                  (inn ? "o" : "r") +
                  '">' +
                  (inn ? "Ocupado" : "Reservado") +
                  "</span></td><td>" +
                  hhmm(inn ? r.checkin : r.start) +
                  "</td>" +
                  '<td class="act">' +
                  (inn
                    ? ""
                    : '<button class="btn sm" data-a="in" data-c="' +
                      r.code +
                      '">Check-in</button>') +
                  '<button class="btn sm out" data-a="' +
                  (inn ? "out" : "cancel") +
                  '" data-c="' +
                  r.code +
                  '">' +
                  (inn ? "Registrar salida" : "Cancelar") +
                  "</button></td></tr>"
                );
              })
              .join("")
          : '<tr><td colspan="5" class="empty">No hay reservas activas.</td></tr>';
      }
      function cost(r) {
        return Math.max(1, Math.ceil((Date.now() - r.checkin) / H)) * RATE;
      }
      function apply(code, act) {
        var a = all(),
          r = a.filter(function (x) {
            return x.code === code;
          })[0],
          m = $("actMsg");
        m.className = "msg";
        m.textContent = "";
        if (
          !r ||
          !active(r) ||
          (act === "in" && r.status !== "reserved") ||
          (act === "out" && r.status !== "in")
        ) {
          m.textContent = "Esa reserva ya cambió. Se actualizó la lista.";
          renderAll();
          return;
        }
        m.className = "msg ok";
        if (act === "in") {
          r.status = "in";
          r.checkin = Date.now();
          m.textContent =
            "Check-in registrado: " + r.plate + " en " + r.spot + ".";
        } else if (act === "cancel") {
          r.status = "cancelled";
          m.textContent =
            "Reserva de " +
            r.plate +
            " cancelada. El cajón " +
            r.spot +
            " quedó libre.";
        } else {
          var c = cost(r);
          r.status = "done";
          m.textContent =
            "Salida de " +
            r.plate +
            " (" +
            r.spot +
            "). Total: $" +
            c +
            " MXN" +
            (isEmp(r.plate)
              ? " (empleado: revisar si aplica descuento)."
              : ".");
        }
        sv("sp2_res", a);
        renderAll();
      }
      $("act").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-a]");
        if (!b) return;
        var act = b.dataset.a,
          code = b.dataset.c,
          r = all().filter(function (x) {
            return x.code === code;
          })[0];
        if (!r) return;
        var who = '<b class="mono">' + esc(r.plate) + "</b>",
          sp = "<b>" + r.spot + "</b>",
          go = function () {
            apply(code, act);
          };
        $("actMsg").textContent = "";
        if (act === "in")
          ask({
            title: "Confirmar check-in",
            body:
              "¿Registrar la entrada de " + who + " en el cajón " + sp + "?",
            ok: "Sí, registrar entrada",
            fn: go,
          });
        else if (act === "cancel")
          ask({
            title: "Cancelar reserva",
            body:
              "Vas a cancelar la reserva de " +
              who +
              " en el cajón " +
              sp +
              ". El cajón quedará libre y <b>esta acción no se puede deshacer</b>.",
            ok: "Sí, cancelar reserva",
            danger: 1,
            fn: go,
          });
        else
          ask({
            title: "Registrar salida",
            body:
              "¿Confirmas la salida de " +
              who +
              " del cajón " +
              sp +
              "?<br>Total a pagar: <b>$" +
              cost(r) +
              " MXN</b>. El cajón quedará libre.",
            ok: "Sí, registrar salida",
            danger: 1,
            fn: go,
          });
      });

      /* ---- Empleados ---- */
      $("empPlate").addEventListener("input", function () {
        this.value = this.value.replace(/[^A-Za-z0-9 -]/g, "");
      });
      function renderEmp() {
        var e = emps();
        $("emp").innerHTML = e.length
          ? e
              .map(function (x, i) {
                return (
                  "<tr><td>" +
                  esc(x.name) +
                  '</td><td class="mono">' +
                  esc(x.plate) +
                  '</td><td class="act"><button class="btn sm out" data-i="' +
                  i +
                  '">Quitar</button></td></tr>'
                );
              })
              .join("")
          : '<tr><td colspan="3" class="empty">Aún no hay empleados registrados.</td></tr>';
      }
      $("empBtn").addEventListener("click", function () {
        var n = $("empName").value.trim(),
          p = $("empPlate").value.trim().toUpperCase(),
          m = $("empMsg");
        m.className = "msg";
        if (!n) {
          m.textContent = "Escribe el nombre.";
          return;
        }
        if (p.length < 5) {
          m.textContent = "Escribe la placa completa (mínimo 5 caracteres).";
          return;
        }
        if (isEmp(p)) {
          m.textContent = "Esa placa ya está registrada.";
          return;
        }
        var e = emps();
        e.push({ name: n, plate: p });
        sv("sp2_emp", e);
        $("empName").value = "";
        $("empPlate").value = "";
        m.className = "msg ok";
        m.textContent = "Empleado registrado.";
        renderAll();
      });
      $("emp").addEventListener("click", function (ev) {
        var b = ev.target.closest("button[data-i]");
        if (!b) return;
        var x = emps()[+b.dataset.i];
        if (!x) return;
        ask({
          title: "Eliminar empleado",
          body:
            "Vas a quitar a <b>" +
            esc(x.name) +
            '</b> (<b class="mono">' +
            esc(x.plate) +
            "</b>) de la lista de empleados. <b>Esta acción no se puede deshacer</b>.",
          ok: "Sí, eliminar",
          danger: 1,
          fn: function () {
            var e = emps().filter(function (y) {
              return y.plate !== x.plate;
            });
            sv("sp2_emp", e);
            $("empMsg").className = "msg ok";
            $("empMsg").textContent = "Empleado eliminado.";
            renderAll();
          },
        });
      });

      /* ---- Confirmación antes de eliminar o modificar ---- */
      var pending = null;
      function ask(o) {
        $("dTitle").textContent = o.title;
        $("dBody").innerHTML = o.body;
        $("dOk").textContent = o.ok;
        pending = o.fn;
        $("dlg").showModal();
        (o.danger ? $("dNo") : $("dOk")).focus();
      }
      $("dNo").addEventListener("click", function () {
        pending = null;
        $("dlg").close();
      });
      $("dOk").addEventListener("click", function () {
        var f = pending;
        pending = null;
        $("dlg").close();
        if (f) f();
      });
      $("dlg").addEventListener("click", function (e) {
        if (e.target === this) {
          pending = null;
          this.close();
        }
      });
      $("dlg").addEventListener("close", function () {
        pending = null;
      });

      /* ---- Menú ---- */
      $("menuBtn").addEventListener("click", function () {
        var o = $("nav").classList.toggle("hidden");
        this.setAttribute("aria-expanded", String(!o));
      });
      $("nav").addEventListener("click", function (e) {
        if (e.target.tagName === "A") {
          $("nav").classList.add("hidden");
          $("menuBtn").setAttribute("aria-expanded", "false");
        }
      });

      function renderAll() {
        renderChart();
        renderFree();
        renderActive();
        renderEmp();
      }
      renderAll();
      setInterval(renderAll, 5000);
      window.addEventListener("storage", renderAll); // se actualiza si el usuario reserva en otra pestaña
    </script>
  </body>
</html>
